services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: level
      POSTGRES_PASSWORD: level
      POSTGRES_DB: leveling
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U level -d leveling"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    environment:
      LEVEL_DATABASE_URL: postgresql+psycopg2://level:level@postgres:5432/leveling
      LEVEL_REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  worker:
    build: ./backend
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=INFO --concurrency=4
    environment:
      LEVEL_DATABASE_URL: postgresql+psycopg2://level:level@postgres:5432/leveling
      LEVEL_REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  web:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [api]

volumes:
  pgdata:
